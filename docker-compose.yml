version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: weight_control_db
    environment:
      POSTGRES_USER: weight_user
      POSTGRES_PASSWORD: weight_pass
      POSTGRES_DB: weight_control
      # Убираем POSTGRES_INITDB_ARGS или меняем на корректную локаль
      # Для Windows используйте:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Временно отключаем скрипт инициализации
      # - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weight_user -d weight_control"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weight_control_network

networks:
  weight_control_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local